name: remirror
description: Learn English through back translation.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  flutter_secure_storage: ^11.2.0
  html_unescape: ^2.0.0
  http: ^1.5.0
  excel: 4.0.6
  file_picker: 13.1.0
  archive: 3.6.1
  markdown: ^7.3.1
  pdfium_flutter: 0.2.3
  ffi: ^2.2.0
  xml: ^6.5.0
  mariannmt_wrapper: ^1.0.2
  path_provider: ^2.1.5
  sqlite3: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/offline/dictionary.sqlite
    - assets/offline/model/model.enzh.intgemm.alphas.bin
    - assets/offline/model/srcvocab.enzh.spm
    - assets/offline/model/trgvocab.enzh.spm
    - assets/offline/model/lex.50.50.enzh.s2t.bin
    - assets/offline/licenses/ECDICT-MIT.txt
    - assets/offline/licenses/Mozilla-MPL-2.0.txt
  fonts:
    - family: LiberationSerif
      fonts:
        - asset: assets/fonts/liberation-fonts-ttf-2.1.5/LiberationSerif-Regular.ttf
        - asset: assets/fonts/liberation-fonts-ttf-2.1.5/LiberationSerif-Bold.ttf
          weight: 700
        - asset: assets/fonts/liberation-fonts-ttf-2.1.5/LiberationSerif-Italic.ttf
          style: italic
        - asset: assets/fonts/liberation-fonts-ttf-2.1.5/LiberationSerif-BoldItalic.ttf
          weight: 700
          style: italic
    - family: AlibabaPuHuiTi
      fonts:
        - asset: assets/fonts/AlibabaPuHuiTi-3-55-Regular.ttf
        - asset: assets/fonts/AlibabaPuHuiTi-3-85-Bold.ttf
          weight: 700
