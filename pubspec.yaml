name: remirror
description: Learn English through back translation.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  flutter_secure_storage: ^11.2.0
  html_unescape: ^2.0.0
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: LiberationSerif
      fonts:
        - asset: assets/fonts/liberation-fonts-ttf-2.1.5/LiberationSerif-Regular.ttf
        - asset: assets/fonts/liberation-fonts-ttf-2.1.5/LiberationSerif-Bold.ttf
          weight: 700
        - asset: assets/fonts/liberation-fonts-ttf-2.1.5/LiberationSerif-Italic.ttf
          style: italic
        - asset: assets/fonts/liberation-fonts-ttf-2.1.5/LiberationSerif-BoldItalic.ttf
          weight: 700
          style: italic
    - family: AlibabaPuHuiTi
      fonts:
        - asset: assets/fonts/AlibabaPuHuiTi-3-55-Regular.ttf
        - asset: assets/fonts/AlibabaPuHuiTi-3-85-Bold.ttf
          weight: 700
